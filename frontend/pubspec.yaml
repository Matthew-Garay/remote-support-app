name: remote_support_app
description: Aplicación de soporte remoto de alto rendimiento (Flutter frontend)
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge:
    git:
      url: https://github.com/fzyzcjy/flutter_rust_bridge
      ref: master
  cupertino_icons: ^1.0.8
  webrtc:
    git:
      url: https://github.com/Telnyx/webrtc.git
      ref: master
  web:
    sdk: flutter
  video_player:
    git:
      url: https://github.com/flutter/plugins.git
      path: packages/video_player/video_player
      ref: master
  image:
    git:
      url: https://github.com/flutter/plugins.git
      path: packages/image/image
      ref: master
  clipboard:
    sdk: flutter
  path_provider:
    sdk: flutter
  shared_preferences:
    sdk: flutter
  rxdart:
    sdk: flutter
  connectivity_plus:
    sdk: flutter
  permission_handler:
    sdk: flutter
  progress_dialog:
    sdk: flutter
  intl:
    sdk: flutter
  logger:
    sdk: flutter
  get_it:
    sdk: flutter
  injectable:
    sdk: flutter
  freezed:
    sdk: flutter
  freezed_annotation:
    sdk: flutter
  json_annotation:
    sdk: flutter
  retrofit:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  retrofit_generator:
    sdk: flutter
  freezed_builder:
    sdk: flutter
  build_runner:
    sdk: flutter
  flutter_rust_bridge_generator:
    git:
      url: https://github.com/fzyzcjy/flutter_rust_bridge
      ref: master

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
