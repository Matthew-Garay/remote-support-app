[package]
name = "remote-backend"
version = "0.1.0"
edition = "2021"
description = "Servidores de señalización, STUN y TURN para Remote Support App"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Web server
actix-web = "4"
actix-rt = "2"

# WebSocket
actix-ws = "4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
dotenvy = "0.15"

# Configuración de servidor
socket2 = "0.6"
