[package]
name = "remote-kernel"
version = "0.1.0"
edition = "2021"
description = "Kernel de bajo nivel para la aplicación de soporte remoto"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# FFI
flutter_rust_bridge = { version = "0.67", features = ["logging", "codegen"] }

# Async runtime
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"

# Network
bytes = "1.10"
socket2 = "0.6"
libc = "0.2"
webrtc = { git = "https://github.com/pion/webrtc", features = ["default"] }
# Quic (fallback)
quinn = "0.11"

# Video encoding
# NA: sysalloc dependent on HW vendor
# H.264 encoder fallback
libx264 = { version = "0.1", optional = true }
# H.265 encoder
libx265 = { version = "0.1", optional = true }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Concurrency
futures = "0.3"
crossbeam = "0.8"

# Platform
once_cell = "1.19"

[build-dependencies]
flutter_rust_bridge = { version = "0.67", features = ["codegen"] }

[features]
default = []
# HW encoders (enable only for supported platforms)
nvenc = ["libx264"]  # NVIDIA
videotoolbox = ["libx265"]  # Apple
quicksync = ["libx264"]  # Intel

# FFI generation
codegen = ["flutter_rust_bridge/codegen"]
