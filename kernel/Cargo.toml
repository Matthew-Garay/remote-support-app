[package]
name = "remote-kernel"
version = "0.1.0"
edition = "2021"
description = "Kernel de bajo nivel para la aplicación de soporte remoto"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# FFI
flutter_rust_bridge = { version = "2.8", features = ["log"] }

# Async runtime
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"

# Network
bytes = "1.10"
socket2 = "0.6"
libc = "0.2"
webrtc = "0.13"
# Quic (fallback)
quinn = "0.11"

# Video encoding — software fallback real (Cisco OpenH264, H.264 SVC)
# HW backends (NVENC / QuickSync / VideoToolbox) se enlazan vía traits
# en kernel/src/encoder/backends/* cuando el SDK de cada vendor está presente.
openh264 = { version = "0.9", features = ["source"], optional = true }

# Señalización WebRTC (cliente WebSocket para el protocolo de señalización)
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Concurrency
futures = "0.3"
crossbeam = "0.8"

# Platform
once_cell = "1.19"

# Errors
thiserror = "2"

# Encoding helpers
byteorder = "1.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
core-foundation = "0.9"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[build-dependencies]
flutter_rust_bridge_codegen = "2.8"

[features]
default = ["sw-openh264"]
# Software fallback (siempre disponible, multiplataforma)
sw-openh264 = ["dep:openh264"]
# HW encoders (requieren SDK/driver del vendor en el host de build;
# los backends hacen detección en runtime y caen a software si no hay HW)
nvenc = ["sw-openh264"]        # NVIDIA Video Codec SDK (NVENCODE API)
quicksync = ["sw-openh264"]    # Intel Media SDK / oneVPL (MFX)
videotoolbox = ["sw-openh264"] # Apple VideoToolbox (macOS / iOS)

[[bench]]
name = "encoder_bench"
harness = false

